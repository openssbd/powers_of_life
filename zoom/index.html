<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Powers of Life — Zoom</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Powers of Life</h1>
    <p class="tagline">A microscope's-eye journey through scale</p>
  </header>

  <section class="slider-section">
    <div class="slider-readout">
      <span>Field of view <span id="targetWidthLabel">-</span></span>
      <span class="count-label"><span id="currentPos">0</span> / <span id="totalCount">0</span></span>
    </div>
    <div class="slider-row">
      <span class="edge-label" id="minLabel">-</span>
      <div class="slider-track-wrap">
        <input type="range" id="widthSlider" min="0" max="1000" step="any" value="500" aria-label="Field of view">
        <div class="scale-ticks" id="scaleTicks"></div>
      </div>
      <span class="edge-label" id="maxLabel">-</span>
    </div>
  </section>

  <main class="zoom-layout">
    <div class="viewport" id="viewport">
      <div class="scale-bar" id="scaleBar"><span id="scaleBarLabel"></span></div>
    </div>
    <div class="zoom-meta" id="meta"></div>
  </main>

  <div id="loadingOverlay" class="loading-overlay">loading…</div>

  <script src="app.js"></script>
</body>
</html>
